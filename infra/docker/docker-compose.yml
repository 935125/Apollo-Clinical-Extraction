services:
  cx-postgres:
    image: postgres:18-alpine
    container_name: cx-postgres
    environment:
      POSTGRES_USER: cx_admin
      POSTGRES_PASSWORD: dev_password_only
      POSTGRES_DB: cx_platform
    ports:
      - "5432:5432"
    volumes:
      - cx_postgres_data:/var/lib/postgresql/data
      - ../../db/platform/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cx_admin -d cx_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  emr-postgres:
    image: postgres:18-alpine
    container_name: emr-postgres
    environment:
      POSTGRES_USER: emr_admin
      POSTGRES_PASSWORD: dev_password_only
      POSTGRES_DB: emr_sim
    ports:
      - "5433:5432"
    volumes:
      - emr_postgres_data:/var/lib/postgresql/data
      - ../../db/emr-simulator/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emr_admin -d emr_sim"]
      interval: 5s
      timeout: 5s
      retries: 5

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: cx-servicebus-emulator
    ports:
      - "5672:5672"
    environment:
      ACCEPT_EULA: "Y"
      CONFIG_PATH: "/etc/servicebus/Config.json"

volumes:
  cx_postgres_data:
  emr_postgres_data:

