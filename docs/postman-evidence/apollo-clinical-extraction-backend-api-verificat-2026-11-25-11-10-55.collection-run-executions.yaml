  body: '{"noteId":"7b83e7bc-c817-4284-9306-8318b107adbb","encounterId":"8bfb5eaa-81ba-4571-baa2-f09c46d97b42","noteVersion":13,"patientReference":"P100234","encounterReference":"ENC-100567","encounterDate":"2026-01-28T11:24:00+05:30","context":"General medicine · Follow-up consultation","noteStatus":"Signed","sourceText":"PATIENT: [REDACTED_NAME] | MRN: [REDACTED_MRN] | DOB: 14/06/1971 (Age: 55F)\nDATE OF ENCOUNTER: 18/11/2026\nDEPARTMENT: Medical Oncology & Precision Genomics\n\nCHIEF COMPLAINT:\nRising serum CA 15-3 and mild right-sided thoracolumbar pain on routine 4-year surveillance post-adjuvant endocrine therapy.\n\nHISTORY OF PRESENT ILLNESS:\nPatient is a 55-year-old postmenopausal female with a history of Stage IIB (pT2N1aM0) invasive ductal carcinoma (IDC) of the left breast, diagnosed in October 2021. Immunohistochemistry (IHC) at diagnosis demonstrated ER-positive (95%), PR-positive (80%), HER2-negative (IHC 1+, FISH non-amplified), and Ki-67 proliferation index of 18%. She underwent left breast-conserving surgery (BCS) with sentinel lymph node biopsy (2/4 nodes positive), followed by adjuvant dose-dense AC-T chemotherapy (Doxorubicin 60 mg/m2, Cyclophosphamide 600 mg/m2 q2w x 4 cycles, followed by Paclitaxel 80 mg/m2 weekly x 12 weeks) and hypofractionated whole-breast radiotherapy (40.05 Gy in 15 fractions). She has been maintained on adjuvant Letrozole 2.5 mg PO daily since May 2022 with good adherence.\n\nOver the past 6 weeks, she reports dull, non-radiating mid-back discomfort (VAS 3/10), worse at night. She denies unintended weight loss, night sweats, dyspnea, headaches, or focal neurological deficits.\n\nDIAGNOSTICS & BIOMARKERS:\n- Labs (15/11/2026): Hemoglobin 12.1 g/dL, WBC 5,400/uL, Platelets 215,000/uL, ALP 148 U/L (elevated), AST 24 U/L, ALT 22 U/L, Serum Calcium 9.4 mg/dL, Creatinine 0.8 mg/dL.\n- Tumor Markers: CA 15-3 elevated at 68.4 U/mL (baseline 14.2 U/mL in May 2026); CEA 4.1 ng/mL.\n- 18F-FDG PET-CT (16/11/2026): Hypermetabolic lytic-sclerotic lesions in the T11 vertebral body (SUVmax 6.8) and right posterior iliac crest (SUVmax 5.4), suspicious for osseous metastases. No visceral, hepatic, or pulmonary FDG-avid disease.\n- Liquid Biopsy (ctDNA / sWGS Fragmentomics, 17/11/2026): Detected pathogenic PIK3CA H1047R mutation (VAF 2.4%) and ESR1 D538G mutation (VAF 1.1%). No BRCA1/2 germline or somatic alterations.\n\nASSESSMENT & PLAN:\n1. Late endocrine-resistant oligometastatic recurrence of ER+/HER2- breast carcinoma to bone (T11, right ilium), likely driven by acquired ESR1 D538G and PIK3CA H1047R mutations.\n2. Discontinue Letrozole monotherapy.\n3. Initiate first-line metastatic regimen: Fulvestrant 500 mg IM (Days 1, 15, 29, then q28d) + Ribociclib 600 mg PO daily (21 days on / 7 days off) + Denosumab 120 mg SC q4w for skeletal-related event prophylaxis.\n4. Perform baseline 12-lead ECG (monitor QTcF) and repeat LFTs/CBC in 14 days prior to Cycle 1 Day 15.\n5. Refer to Radiation Oncology for palliative stereotactic body radiotherapy (SBRT) evaluation to T11 lesion.","sourceHash":"956F0518F585C2FA9BFD48FD51A04030CD4425CF6643A919444E25CC54E245B4","signedAt":"2026-11-25T11:03:11.042096+05:30","updatedAt":"2026-11-25T11:03:11.042096+05:30","queueState":"Ready","verificationRecommended":true,"rawProcessingStatus":"Needs Review","error":null,"extraction":{"schemaVersion":"1.0.0","extractionId":"2b7aed72-c2f1-436e-b7b9-b33c151a0011","correlationId":"c31c1197-2e10-452f-9b5c-97e712061bd5","extractedAt":"2026-11-25T05:33:12+00:00","executionDurationMs":211.55,"modelMetadata":{"adapterType":"onnx_neurosymbolic_int8","modelDeployment":"bc5cdr_int8","promptVersion":"v2.1.0","promptTokens":null,"completionTokens":null,"totalTokens":null,"estimatedCostUsd":null,"provider":"onnx","model":"bc5cdr_int8","azureDeployment":null,"fallbackReason":null,"inferenceExecuted":true,"attempts":[{"provider":"onnx","model":"bc5cdr_int8","deployment":null,"outcome":"accepted","reason":null,"durationMs":211.3,"inference