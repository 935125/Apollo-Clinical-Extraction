[project]
name = "cx-worker"
version = "0.1.0"
description = "Clinical AI Extraction Platform Queue Worker"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.16.0",
    "rapidfuzz>=3.14.0",
    "structlog>=24.4.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
