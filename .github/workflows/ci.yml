name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: dotnet restore AIExtraction.slnx
      - name: Build Solution
        run: dotnet build AIExtraction.slnx --no-restore --configuration Release
      - name: Run Tests
        run: dotnet test backend/tests/Apollo.Backend.Tests.csproj --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend (Angular 21 LTS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - name: Install Dependencies
        working-directory: frontend
        run: npm ci
      - name: Run Unit Tests
        working-directory: frontend
        run: npm test -- --watch=false
      - name: Build Application
        working-directory: frontend
        run: npm run build

